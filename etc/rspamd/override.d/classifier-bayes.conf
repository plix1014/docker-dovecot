
bayes {
  backend = "redis";

  # Mindestanzahl Tokens im Mailtext
  min_tokens = 11;

  # Erst ab genügend Daten wird Bayes aktiv genutzt
  min_learns = 200;

  # Schutz gegen schlechtes Training
  learn_condition = "return require(\"lua_bayes_learn\").can_learn";

  # Automatisches Lernen
  autolearn = true;

  # Feiner einstellen (empfohlen statt nur autolearn = true)
  autolearn {
    spam_threshold = 6.0;   # ab Score 6 → Spam lernen
    ham_threshold = -0.5;   # unter -0.5 → Ham lernen
  }

  statfile {
    symbol = "BAYES_SPAM";
    spam = true;
  }

  statfile {
    symbol = "BAYES_HAM";
    ham = true;
  }
}

